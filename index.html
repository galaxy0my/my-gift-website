<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送给我们的惊喜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0c1445 0%, #1a237e 40%, #283593 100%);
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    position: relative;
  }

  /* 小提示文字 */
  .hint {
    position: fixed;
    top: 30px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-size: 18px;
    z-index: 10;
    letter-spacing: 2px;
  }

  /* 计数器 */
  .counter {
    position: fixed;
    top: 70px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    z-index: 10;
  }

  /* 小满天星背景 */
  .tiny-star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    100% { opacity: 0.9; transform: scale(1.3); }
  }

  /* 可点击的大花 */
  .big-flower {
    position: absolute;
    width: 80px;
    height: 80px;
    cursor: pointer;
    transition: transform 0.3s, opacity 0.8s;
    z-index: 5;
    filter: drop-shadow(0 0 12px rgba(255,255,255,0.5));
  }

  .big-flower:hover {
    transform: scale(1.2);
  }

  .big-flower.collected {
    opacity: 0;
    pointer-events: none;
    transform: scale(0);
  }

  /* 大花用SVG画 */
  .big-flower svg {
    width: 100%;
    height: 100%;
  }

  /* 浮现的文字 */
  .float-text {
    position: absolute;
    color: white;
    font-size: 18px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 8;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: floatUp 3s ease-out forwards;
    max-width: 200px;
  }

  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(20px); }
    20% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; transform: translateY(-10px); }
    100% { opacity: 0; transform: translateY(-30px); }
  }

  /* 最终惊喜页遮罩 */
  .surprise-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 100;
    animation: fadeIn 1s ease;
  }

  .surprise-overlay.show {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .surprise-box {
    background: linear-gradient(135deg, #fff5f5, #ffe0ec);
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 340px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    animation: popIn 0.6s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }

  .surprise-box h2 {
    color: #e91e63;
    font-size: 24px;
    margin-bottom: 15px;
  }

  .surprise-box p {
    color: #555;
    font-size: 16px;
    line-height: 1.8;
  }

  .surprise-box .emoji {
    font-size: 40px;
    margin-bottom: 10px;
  }

  /* 照片区域（可选） */
  .photo-area {
    width: 100%;
    height: 180px;
    background: #f5f5f5;
    border-radius: 12px;
    margin: 15px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 14px;
    overflow: hidden;
  }

  .photo-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
  }
</style>
</head>
<body>

<div class="hint">✨ 帮我们收集散落的满天星吧 ✨</div>
<div class="counter">已收集：<span id="count">0</span> / 5</div>

<!-- 5朵大花 -->
<div class="big-flower" style="top:18%;left:12%" onclick="collect(this,0)">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="#fff" opacity="0.9"/><circle cx="35" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="65" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="40" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="60" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="50" cy="48" r="8" fill="#ffe082"/></svg>
</div>
<div class="big-flower" style="top:25%;right:15%" onclick="collect(this,1)">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="#fff" opacity="0.9"/><circle cx="35" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="65" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="40" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="60" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="50" cy="48" r="8" fill="#ffe082"/></svg>
</div>
<div class="big-flower" style="top:50%;left:8%" onclick="collect(this,2)">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="#fff" opacity="0.9"/><circle cx="35" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="65" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="40" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="60" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="50" cy="48" r="8" fill="#ffe082"/></svg>
</div>
<div class="big-flower" style="top:55%;right:10%" onclick="collect(this,3)">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="#fff" opacity="0.9"/><circle cx="35" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="65" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="40" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="60" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="50" cy="48" r="8" fill="#ffe082"/></svg>
</div>
<div class="big-flower" style="top:75%;left:40%" onclick="collect(this,4)">
  <svg viewBox="0 0 100 100"><circle cx="50" cy="30" r="12" fill="#fff" opacity="0.9"/><circle cx="35" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="65" cy="45" r="12" fill="#fff" opacity="0.85"/><circle cx="40" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="60" cy="60" r="12" fill="#fff" opacity="0.8"/><circle cx="50" cy="48" r="8" fill="#ffe082"/></svg>
</div>

<!-- 最终惊喜页 -->
<div class="surprise-overlay" id="surprise">
  <div class="surprise-box">
    <div class="emoji">💐</div>
    <h2>我们仨，永远是最好的朋友</h2>
    <div class="photo-area">
     <div style="display:flex;justify-content:center;gap:20px;"> 
       < img src="xport11794560052908.jpg" alt="我们的合照"style="width:48%;"> 
      <img src="xport1794560077773.jpg" alt="我们的合照"style="width:48%;">
      </div>
      这里可以放你们的合照哦
    </div>
    <p>这是我亲手做的小惊喜，送给我们仨。<br>不管以后走到哪里，<br>我们永远是最好的朋友 🌸</p >
  </div>
</div>

<script>
// 5句祝福文案
const messages = [
  "我们三个人的笑声是最动听的 😄",
  "有你们在的日子总是特别开心 🌟",
  "希望我们一直这样吵吵闹闹 🎉",
  "不管遇到什么，我们仨一起扛 💪",
  "友谊万岁，我们永远不散 🌸"
];

let collected = 0;

function collect(el, index) {
  if (el.classList.contains('collected')) return;

  el.classList.add('collected');
  collected++;
  document.getElementById('count').textContent = collected;

  // 在点击位置附近浮现文字
  const text = document.createElement('div');
  text.className = 'float-text';
  text.textContent = messages[index];
  text.style.left = el.style.left || (window.innerWidth - 100) + 'px';
  text.style.top = el.style.top;
  document.body.appendChild(text);

  setTimeout(() => text.remove(), 3000);

  // 全部收集完 → 弹出惊喜页
  if (collected === 5) {
    setTimeout(() => {
      document.getElementById('surprise').classList.add('show');
    }, 1500);
  }
}

// 生成满天星背景
for (let i = 0; i < 120; i++) {
  const star = document.createElement('div');
  star.className = 'tiny-star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.animationDelay = Math.random() * 3 + 's';
  star.style.width = star.style.height = (Math.random() * 3 + 2) + 'px';
  document.body.appendChild(star);
}
</script>
</body>
</html>
